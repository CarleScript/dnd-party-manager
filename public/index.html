<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Party Manager</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
    <script src="/socket.io/socket.io.js" defer></script>
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <main id="app-container">

        <section id="login-view" class="view hidden">
            <header class="view-header">
                <h1>D&D Party Manager</h1>
            </header>

            <div class="view-content">
                <div class="form-card">
                    <div class="input-group">
                        <label for="username">Character Name</label>
                        <input type="text" id="username" placeholder="Adventurer" required autocorrect="off"
                            autocomplete="off" spellcheck="false">
                    </div>

                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="userRole" value="player" checked>
                            <span class="radio-custom">Player</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="userRole" value="master">
                            <span class="radio-custom">Master</span>
                        </label>
                    </div>

                    <button id="btn-join" class="btn-primary">Join Party</button>
                </div>
            </div>
        </section>

        <section id="room-view" class="view hidden">
            <header class="view-header">
                <h2>Initiative Order</h2>
            </header>

            <div class="view-content room-content">
                <div id="player-list"></div>

                <div class="room-actions">
                    <button class="btn-secondary hidden" id="btn-add-npc">ADD NPC</button>
                    <button class="btn-secondary" id="btn-leave">DESERT</button>
                </div>

                <dialog id="modal-npc" class="npc-dialog">
                    <div class="dialog-content">
                        <button type="button" id="btn-close-modal" class="dialog-close" aria-label="Close dialog">
                            <svg class="dialog-close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                fill="none" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                        </button>
                        <h2 class="npc-dialog-title">NPC STATS</h2>

                        <form id="form-npc" class="npc-dialog-form" method="dialog">
                            <div class="input-group">
                                <label for="npc-name">Name</label>
                                <input autofocus type="text" name="name" id="npc-name" placeholder="Monster" required
                                    autocorrect="off" autocomplete="off" spellcheck="false">
                                <label for="npc-init">INIT</label>
                                <input type="number" name="init" id="npc-init" value="0" min="0" max="0">
                                <label for="npc-current-hp">Current HP</label>
                                <input type="number" name="currentHp" id="npc-current-hp" value="0" min="0" max="0">
                                <label for="npc-max-hp">Max HP</label>
                                <input type="number" name="maxHp" id="npc-max-hp" value="0" min="0" max="0">
                            </div>

                            <button type="submit" value="confirm" class="btn-primary">Confirm</button>
                        </form>
                    </div>
                </dialog>
            </div>
        </section>

    </main>
</body>

</html>
